[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-debate-engine"
version = "0.1.0"
description = "LLM Delphi panels with fitted calibration and the right to abstain"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = ["debate", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# A001/A002: `id`, `round` and `format` are the right names for these fields. Renaming a
# domain concept to avoid shadowing a builtin nobody uses in that scope trades clarity for a
# lint score.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
